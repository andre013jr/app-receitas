name: recipe_app
description: "Um aplicativo de receitas onde os usuários podem adicionar e favoritar receitas."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6
  cupertino_icons: ^1.0.6
  firebase_core: ^2.27.0 # Adicionar para inicializar o Firebase
  firebase_auth: ^4.17.8 # Adicionar para autenticação
  cloud_firestore: ^4.15.8 # Adicionar para banco de dados Firestore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_svg: ^2.0.9

  flutter_lints: ^3.0.0

flutter:
  assets:
     - assets/images/decoration.svg

  uses-material-design: true

 

 
